<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <meta http-equiv="X-UA-Compatible" content="ie=edge">
   <title>Pronoun Tester</title>
   <link rel="stylesheet" href="styles.css"> <!-- Link to external CSS -->
</head>
<body>
    <h2 class="title">Pronoun Tester</h2>

    <form class="user-info-form">
        <div class="question">
        <label for="name">Insert Your Name</label>
        <input type="text" id="name">
        <button type="button" onclick="submitName()">Submit name</button>
        </div>

        <div class="question">
        <label for="pronouns">Select Your Pronoun(s)</label>
        <select id="pronouns">
            <option value="They/Them" selected>They/Them</option>
            <option value="He/Him" >He/Him</option>
            <option value="She/Her" >She/Her</option>
            <!--yo btw future ro dont forget to add more-->
        </select>
        <button type="button" onclick="submitPronouns()">Add Pronouns</button>
        </div>
    </form>

    <div class="user-info">
        <h3>Name: <span id="user-name">Blank</span></h3>
        <h3>Pronouns: <span id="user-pronouns">Blank</span></h3>
    </div>

    <footer>
        <p>V.1</p>
    </footer>
   <script src="scripts.js"></script> <!-- Link to external JavaScript -->
</body>
</html>
